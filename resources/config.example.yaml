host:
  address: 127.0.0.1
  port: 8008

public_base_url: https://mcp.example.com

logfire:
  # Telemetry is exported only when a token is configured.
  # token: your-logfire-write-token
  environment: production
  service_name: agent-proxy

# MCP servers now live in PostgreSQL and are managed at runtime through the
# admin API and UI, not through this file.
postgresql:
  address: localhost
  port: 5432
  username: proxy
  password: proxy
  db_name: proxy

# Required: the identity provider that may log in to the admin API and UI.
# Any user authenticated against this provider is an administrator.
admin:
  auth:
    provider: keycloak
    realm_url: https://identity.example.com/realms/agents
    # Required: public client the admin UI uses for the browser Authorization
    # Code flow with PKCE. Register {ui-origin}/admin/callback as a redirect
    # URI on this client in the realm.
    client_id: admin
# Or AWS Cognito's managed login with a public app client and PKCE. The
# gateway derives the original Cognito issuer and JWKS URL from the pool ID.
#   provider: aws-cognito
#   user_pool_id: eu-central-1_XXXXXXXXX
#   client_id: your-public-cognito-app-client
#   aws_region: eu-central-1
#   # Optional: use an explicitly configured Cognito issuer instead of the
#   # original region-hosted issuer.
#   issuer_url: https://cognito-idp.eu-central-1.amazonaws.com/eu-central-1_XXXXXXXXX
# Or a plain username/password account instead of an OAuth provider. The
# gateway signs a short-lived HS256 JWT with jwt_secret after a successful
# login. jwt_secret defaults to a public development-only value — always set
# it explicitly (32+ random bytes).
#   username: admin
#   password: change-me
#   jwt_secret: ${ADMIN_JWT_SECRET}
#   token_ttl_seconds: 3600

# Required: a separate identity provider for end users who create model API
# keys. Static username/password authentication is intentionally unsupported
# here because every token must identify a distinct user. Browser login always
# requests the openid and email scopes; register {ui-origin}/account/callback.
user:
  auth:
    provider: keycloak
    realm_url: https://identity.example.com/realms/agents
    client_id: user
  oauth_scopes:
    - openid
    - email

# Required at startup. Generate a Fernet key and provide it through the
# environment in production; do not commit a real key.
model_gateway:
  credential_encryption_key: ${MODEL_GATEWAY_CREDENTIAL_ENCRYPTION_KEY}
