host:
  address: 127.0.0.1
  port: 8008

public_base_url: https://mcp.example.com

logfire:
  # Telemetry is exported only when a token is configured.
  # token: your-logfire-write-token
  environment: production
  service_name: agent-proxy

# MCP servers now live in PostgreSQL and are managed at runtime through the
# admin API and UI, not through this file.
database:
  url: postgresql+asyncpg://proxy:proxy@localhost:5432/proxy

# Optional: the identity provider that may log in to the admin API and UI.
# Any user authenticated against this provider is an administrator. When
# omitted, the admin interface returns HTTP 503.
admin:
  auth:
    provider: keycloak
    realm_url: https://identity.example.com/realms/agents
    # Required: public client the admin UI uses for the browser Authorization
    # Code flow with PKCE. Register {ui-origin}/admin/callback as a redirect
    # URI on this client in the realm.
    client_id: admin
# Or a plain username/password account instead of an OAuth provider. The
# gateway signs a short-lived HS256 JWT with jwt_secret after a successful
# login. jwt_secret defaults to a public development-only value — always set
# it explicitly (32+ random bytes).
#   username: admin
#   password: change-me
#   jwt_secret: ${ADMIN_JWT_SECRET}
#   token_ttl_seconds: 3600
