host:
  address: 127.0.0.1
  port: 8008

public_base_url: http://localhost:8008

middleware:
  cors:
    origins:
      - http://localhost:3000

postgresql:
  address: 127.0.0.1
  port: 5433
  username: proxy
  password: proxy
  db_name: proxy

logfire:
  environment: development
  service_name: agent-proxy-dev

admin:
