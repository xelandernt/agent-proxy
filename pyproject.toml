[build-system]
requires = [
    "hatchling", "hatch-vcs"
]
build-backend = "hatchling.build"

[project]
name = "agent-proxy"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "asyncpg>=0.30.0",
    "cyclopts>=4.16.1",
    "fastapi>=0.136.3",
    "greenlet>=3.2.4",
    "logfire[fastapi,system-metrics]>=4.34.0",
    "loguru>=0.7.3",
    "niquests>=3.18.8",
    "pydantic-settings[yaml]>=2.14.1",
    "pyjwt[crypto]>=2.10.1",
    "sqlalchemy>=2.0.43",
    "uvicorn>=0.48.0",
]
dynamic = ["version"]



[project.scripts]
proxy = "proxy.cli.cli:cli"


[dependency-groups]
dev = [
    "prek>=0.4.3",
    "pyrefly>=1.0.0",
    "pytest>=9.0.3",
    "pytest-asyncio>=1.4.0",
    "ruff>=0.15.14",
    "testcontainers>=4.13.2",
]


[tool.pyrefly]
project-includes = [
    "**/*.py*",
    "**/*.ipynb",
]
site_package_path = ["src", "tests"]

[tool.pytest.ini_options]
addopts = [
    "--import-mode=importlib",
    "--ignore=.tox/",
    "--ignore=tmp/",
    "--strict-markers",
]
asyncio_mode = "auto"
markers = [
    "integration: Docker-backed integration tests that require a running Docker daemon.",
]
pythonpath=["src", "tests"]

[tool.fastapi]
entrypoint = "proxy.app.main:app"

[tool.hatch.version]
source = "vcs"
fallback-version = "0.0.1"


[tool.hatch.build.targets.wheel]
packages = ["src/proxy"]
