[build-system]
requires = [
    "hatchling", "hatch-vcs"
]
build-backend = "hatchling.build"

[project]
name = "agent-proxy"
description = "An MCP authentication and OpenAI-compatible model gateway"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "asyncpg>=0.30.0",
    "cryptography>=46.0.0",
    "cyclopts>=4.16.1",
    "fastapi>=0.139.2",
    "fastmcp==4.0.0b2",
    "httpx2>=2.9.1",
    "joserfc>=1.7.4",
    "litellm==1.94.1",
    "logfire[fastapi,system-metrics]>=4.34.0",
    "pydantic>=2.12.0",
    "pydantic-settings[yaml]>=2.14.1",
    "sqlalchemy[asyncio]>=2.0.43",
    "uvicorn>=0.48.0",
]
dynamic = ["version"]



[project.scripts]
proxy = "proxy.cli.cli:cli"


[dependency-groups]
dev = [
    "openai>=2.54.0",
    "prek>=0.4.3",
    "pyrefly>=1.0.0",
    "pytest>=9.0.3",
    "pytest-asyncio>=1.4.0",
    "ruff>=0.15.14",
    "testcontainers>=4.14.2",
]

[tool.uv]
constraint-dependencies = ["fastmcp-slim==4.0.0b2"]


[tool.pyrefly]
project-includes = [
    "**/*.py*",
    "**/*.ipynb",
]
site_package_path = ["src", "tests"]

[tool.pytest.ini_options]
addopts = [
    "--import-mode=importlib",
    "--ignore=.tox/",
    "--ignore=tmp/",
    "--strict-markers",
]
asyncio_mode = "auto"
markers = [
    "integration: Docker-backed end-to-end gateway tests.",
]
pythonpath=["src", "tests"]

[tool.hatch.version]
source = "vcs"
fallback-version = "0.0.1"


[tool.hatch.build.targets.wheel]
packages = ["src/proxy"]
