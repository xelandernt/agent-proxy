name: agent-proxy

services:
  keycloak:
    image: quay.io/keycloak/keycloak:26.6.0
    command:
      - start-dev
      - --import-realm
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: admin
    ports:
      - "127.0.0.1:8080:8080"
    volumes:
      - ./resources/keycloak/realm.json:/opt/keycloak/data/import/realm.json:ro
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          exec 3<>/dev/tcp/127.0.0.1/8080 &&
          printf 'GET /realms/agent-proxy/.well-known/openid-configuration HTTP/1.1\r\nHost: keycloak.localhost:8080\r\nConnection: close\r\n\r\n' >&3 &&
          grep -q '200 OK' <&3
      interval: 5s
      timeout: 3s
      retries: 30
      start_period: 15s
    networks:
      default:
        aliases:
          - keycloak.localhost

  mcp-server:
    build:
      context: .
    command:
      - python
      - examples/mcp_server.py
    ports:
      - "127.0.0.1:8000:8000"
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - >-
          import socket;
          connection = socket.create_connection(('127.0.0.1', 8000), timeout=2);
          connection.close()
      interval: 3s
      timeout: 3s
      retries: 20
      start_period: 5s

  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: proxy
      POSTGRES_USER: proxy
      POSTGRES_PASSWORD: proxy
    ports:
      - "127.0.0.1:5433:5432"
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U proxy -d proxy
      interval: 3s
      timeout: 3s
      retries: 30
      start_period: 5s
