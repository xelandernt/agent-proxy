name: proxy-${ENV:-dev}
services:

  playwright-mcp:
    image: mcr.microsoft.com/playwright/mcp
    container_name: playwright
    entrypoint: [ "node" ]
    command:
      - "cli.js"
      - "--headless"
      - "--browser"
      - "chromium"
      - "--no-sandbox"
      - "--port"
      - "8931"
      - "--host"
      - "0.0.0.0"
    ports:
      - "8931:8931"
    restart: unless-stopped
